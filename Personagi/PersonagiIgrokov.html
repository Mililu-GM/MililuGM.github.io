<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Персонажи игроков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            padding: 20px;
        }

        .nav-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 50px 60px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
            position: relative;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === Кнопка «Назад» === */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.75);
            text-decoration: none;
            font-size: 0.9rem;
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(-4px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.95rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 20px 28px;
            border-radius: 16px;
            font-size: 1.15rem;
            font-weight: 500;
            min-width: 320px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            overflow: hidden;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .nav-link:hover::before {
            left: 100%;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            transform: translateX(8px) scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-link:active {
            transform: translateX(4px) scale(0.99);
        }

        .link-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-right: 18px;
            flex-shrink: 0;
        }

        .link-icon.plaga {
            background: linear-gradient(135deg, #ff6b6b, #ee0979);
        }

        .link-icon.seven {
            background: linear-gradient(135deg, #00c9ff, #92fe9d);
            color: #0a3d2b;
        }

        .link-text {
            flex: 1;
            text-align: left;
        }

        .link-arrow {
            font-size: 1.4rem;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .nav-link:hover .link-arrow {
            opacity: 1;
            transform: translateX(5px);
        }

        .footer {
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .nav-container {
                padding: 35px 25px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .nav-link {
                min-width: auto;
                padding: 16px 20px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="nav-container">
        <!-- Кнопка возврата в главное меню -->
        <a href="index.html" class="back-link">← В главное меню</a>

        <h1>Персонажи игроков</h1>
        <p class="subtitle">Выберите страницу</p>

        <nav class="links">
            <a href="Plaga/Plaga.html" class="nav-link">
                <span class="link-icon plaga">🔥</span>
                <span class="link-text">Plaga</span>
                <span class="link-arrow">→</span>
            </a>

            <a href="Seven_Four74/Seven_Four74.html" class="nav-link">
                <span class="link-icon seven">⚡</span>
                <span class="link-text">Seven_Four74</span>
                <span class="link-arrow">→</span>
            </a>
        </nav>

        <p class="footer">© Navigation Page</p>
    </div>
</body>
</html>
